name: Build Personal

# Personal build: produces an Android APK and a Windows NSIS installer with the
# third-party cloud-sync paywall disabled (WebDAV/S3/Drive work without signing
# in). Triggered manually; artifacts are downloaded from the run page.
#
# Trimmed from release.yml's build-tauri job: no GitHub Release, no signing
# secrets, no R2/attestation/latest.json. APK is built as a signed release by
# generating a one-off keystore on every run (fine for sideloading on your own
# devices; not for store distribution). Because the keystore is regenerated
# each run, the signing key changes between builds — you must uninstall the old
# app before installing a new build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v4

      - name: install NDK 28.2.13676358
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-android-cargo

      - name: build Android APK (arm64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app/
          # Regenerate the Android project then restore the repo's checked-in
          # version so keystore/signing config matches what the app expects.
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          # Generate a one-off release keystore so the release build type gets a
          # signingConfig (build.gradle.kts only wires one up when keystore.properties
          # exists; otherwise the APK comes out unsigned and Android refuses to
          # install it with "packageinfo is null"). Distinguished names with commas
          # must be quoted; the password is arbitrary since we never distribute this.
          keytool -genkeypair -v \
            -keystore src-tauri/gen/android/app/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass readest -keypass readest \
            -dname "CN=Readest Personal, O=Personal, C=US"
          printf 'storeFile=release.keystore\npassword=readest\nkeyAlias=release\nkeyPassword=readest\n' \
            > src-tauri/gen/android/keystore.properties

          # arm64-only: smallest APK, covers essentially all modern phones.
          pnpm tauri android build -t aarch64

      - name: upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: readest-android-apk
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      # Pinned to 1.81 (not `stable`) on purpose: the `battery` 0.7.8 crate
      # (pulled in transitively via tauri-plugin-device-info) takes references
      # to fields of `#[repr(packed)]` Windows FFI structs, which became a
      # hard error (E0793) starting in Rust 1.82. `battery` is unmaintained
      # (last release 2022), so a stable toolchain can no longer build it.
      # 1.81 is the last version before that error landed.
      - name: install Rust 1.81
        uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-cargo

      - name: build Windows installer (NSIS, x64)
        shell: bash
        run: |
          cd apps/readest-app/
          pnpm build-win-x64

      - name: upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: readest-windows-installer
          # build-win-x64 targets i686-pc-windows-msvc but emits an x64-setup NSIS bundle
          path: apps/readest-app/src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
